plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

group = 'ru.simplecasino'
version = '1.0.0'
archivesBaseName = 'SimpleCasino'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods {
                simplecasino {
                    source sourceSets.main
                }
            }
        }
        client {}
        server {
            args '--nogui'
        }
    }
}

repositories {}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.20'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: '1.21.1',
            forge_version: '52.1.20',
            mod_id: 'simplecasino',
            mod_name: 'Simple Casino',
            mod_version: project.version,
            mod_authors: 'SimpleCasino Team',
            mod_description: 'Slot machine. Bet diamonds, spin, win diamonds.'
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
